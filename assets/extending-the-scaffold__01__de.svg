<text x="60" y="62" font-size="40" font-weight="700" fill="#0A0A0A">Ein Service, zwei Aufgaben</text>
<text x="60" y="105" font-size="24" font-weight="400" fill="#27784C">Gemeinsame Verarbeitung behalten. Route und Prompt ändern.</text>
<text x="185" y="162" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Bereits vorhanden</text>
<text x="200" y="372" font-size="18" font-weight="700" fill="#0A0A0A" text-anchor="middle">Deine Erweiterung</text>
<text x="200" y="205" font-size="22" font-weight="700" fill="#27784C">Techniker:in</text>
<text x="200" y="249" font-size="26" font-weight="700" fill="#0A0A0A">/v1/diagnose</text>
<text x="200" y="287" font-size="22" font-weight="400" fill="#0A0A0A">Technik-Prompt</text>
<text x="200" y="415" font-size="22" font-weight="700" fill="#27784C">Disposition</text>
<text x="200" y="459" font-size="26" font-weight="700" fill="#0A0A0A">/v1/dispatch-handover</text>
<text x="200" y="497" font-size="22" font-weight="400" fill="#0A0A0A">Dein Übergabe-Prompt</text>
<text x="912.5" y="389" font-size="21" font-weight="700" fill="#0A0A0A" text-anchor="middle">Gemeinsamer Service</text>
<text x="912.5" y="420" font-size="20" font-weight="400" fill="#27784C" text-anchor="middle">run_diagnosis()</text>
<text x="1250" y="389" font-size="23" font-weight="700" fill="#0A0A0A" text-anchor="middle">Modelladapter</text>
<text x="1250" y="420" font-size="20" font-weight="400" fill="#27784C" text-anchor="middle">generate_answer()</text>
<text x="60" y="620" font-size="22" font-weight="400" fill="#0A0A0A">Unterstützte Eingaben folgen diesem Pfad. Rückfragen werden vor dem Modellaufruf behandelt.</text>
