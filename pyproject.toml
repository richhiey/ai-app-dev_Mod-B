[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-app-dev-module-b"
version = "0.8.1"
description = "FieldCare service and teaching patterns for AI App Development Module B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.2,<2",
  "pydantic>=2.7,<3",
  "chromadb>=0.5,<2",
  "langgraph>=0.2,<2",
  "pandas>=2,<3",
  "ipython>=8,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "nbconvert>=7,<8"]

[tool.setuptools.packages.find]
where = ["src", "service"]
include = ["module_b*", "fieldcare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"module_b._module_a" = ["data/*", "provenance.json", "LICENSE"]
