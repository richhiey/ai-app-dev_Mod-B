name: Local Campus service
on: [push, pull_request]
jobs:
  student-path:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]" -c requirements.lock
      - run: python -m pytest tests/test_local_service.py tests/test_security.py tests/test_observability.py tests/test_openrouter_errors.py
